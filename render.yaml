services:
  - type: web
    name: crow-optimiser-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-cctv.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: AI_PROVIDER_MODE
        value: mock
